<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piste Noire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg">
<title>Piste Noire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* VOICE: coach sportif, direct, énergique
   IDEA: un dossard de course de ski + un tableau de bord d'appli running
   PICTURE: trois anneaux du jour (Sobriété, Sport, Assiette) + série géante
   COLOUR and TYPE: noir profond, blanc, orange dossard ; pistes vert/bleu/rouge/noir pour les niveaux ; Barlow Condensed italique
   LAYOUT: une colonne mobile, nav basse, cartes pleine largeur */
:root{color-scheme:dark;--bg:#0a0a0b;--card:#151518;--card2:#1d1d21;--line:#2a2a30;--ink:#f4f4f5;--mute:#9a9aa3;--acc:#ff5a1f;--acc2:#ffb199;
--g:#22c55e;--b:#3b82f6;--r:#ef4444;--k:#e5e5e5;--sob:#22c55e;--spo:#ff5a1f;--ass:#38bdf8}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:800;margin:0;line-height:1.02}
h1{font-size:40px;font-style:italic;text-transform:uppercase;letter-spacing:-.5px}
h2{font-size:26px;font-style:italic;text-transform:uppercase}
h3{font-size:20px}
p{margin:.3em 0}
.mute{color:var(--mute)}.small{font-size:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.top .sub{color:var(--mute);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{background:var(--card2);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:15px}
.pill.on{background:var(--ink);color:#000}
.cta{background:var(--acc);color:#000;font-weight:800;border-radius:999px;padding:14px 22px;min-height:48px;font-family:"Barlow Condensed";font-size:20px;font-style:italic;text-transform:uppercase;letter-spacing:.3px}
.cta.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.cta.done{background:var(--g)}
/* héros */
.hero{position:relative;background:radial-gradient(120% 90% at 85% 0%,#2a1206 0%,transparent 55%),linear-gradient(180deg,#141416,#0d0d0f);border-radius:28px;padding:20px 18px 18px;overflow:hidden;margin-bottom:14px}
.hero svg.mnt{position:absolute;inset:auto 0 0 0;width:100%;height:46%;opacity:.5}
.heroTop{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.streak .num{font-size:clamp(84px,26vw,132px);font-style:italic;font-weight:900;letter-spacing:-3px}
.streak .lab{font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.5px;color:var(--acc2)}
.rings{width:min(42vw,170px);aspect-ratio:1}
.legend{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.legend div{background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px}
.legend b{display:block;font-family:"Barlow Condensed";font-size:22px;font-style:italic}
.legend span{font-size:12px;color:var(--mute);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.countdowns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.cd{background:var(--card);border-radius:20px;padding:14px 16px}
.cd .num{font-size:44px;font-style:italic}
.cd .num small{font-size:18px;margin-left:2px}
.cd span{font-size:13px;color:var(--mute);font-weight:600}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.daynav button{width:44px;height:44px;border-radius:50%;background:var(--card);font-size:22px}
.daynav strong{font-family:"Barlow Condensed";font-size:22px;font-style:italic;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.seg button{background:var(--card2);border-radius:16px;padding:12px 6px;min-height:64px;font-weight:700;font-size:15px;line-height:1.15}
.seg button small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:3px}
.seg button.on.none{background:var(--g);color:#000}.seg button.on.light{background:#eab308;color:#000}.seg button.on.drink{background:var(--r);color:#fff}
.seg button.on small{color:inherit;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:12px -4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .pill{flex:none}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.chk.on{background:var(--acc);border-color:var(--acc);color:#000}
.chk svg{width:20px;height:20px}
.ex .rx{font-family:"Barlow Condensed";font-weight:800;font-size:19px;font-style:italic;white-space:nowrap}
.ex .tip{font-size:13px;color:var(--mute)}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;min-height:56px}
.toggle:first-of-type{border-top:0}
.toggle b{display:block}.toggle span{font-size:13px;color:var(--mute)}
.xp{font-family:"Barlow Condensed";font-style:italic;font-weight:800;color:var(--acc)}
.weight{display:flex;gap:10px;align-items:center;margin-top:8px}
.weight input{flex:1;background:var(--card2);border:0;border-radius:14px;padding:12px 14px;color:var(--ink);font:800 26px "Barlow Condensed";font-style:italic;width:100%}
.glasses{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin-top:10px}.glasses i{height:26px;border-radius:5px 5px 8px 8px;background:var(--card2);border:1px solid var(--line)}.glasses i.on{background:var(--ass);border-color:var(--ass)}
.work{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.workIn{max-width:640px;margin:0 auto}
.intr{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 80% at 80% 0%,#3a1606,#0a0a0b 60%);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}.intrIn{width:100%;max-width:460px}
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0}.mrow>b{font-size:15px}
.psts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pst{background:var(--card2);border-radius:12px;min-height:44px;font-size:13px;font-weight:700;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:5px;border:2px solid transparent}
.pst i{width:9px;height:9px;transform:rotate(45deg);background:var(--pc);border-radius:2px;flex:none}
.pst.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 22%,var(--card2))}
@media(max-width:380px){.mrow{grid-template-columns:1fr}.pst{font-size:12px}}
.idea{background:linear-gradient(135deg,#0f2533,#13161b);border-radius:18px;padding:14px;margin-top:12px}
/* calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.cal button{aspect-ratio:1;border-radius:12px;background:var(--card2);font-family:"Barlow Condensed";font-weight:800;font-size:18px;position:relative;padding:0}
.cal button.none{background:var(--g);color:#000}.cal button.light{background:#eab308;color:#000}.cal button.drink{background:var(--r)}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.ch{box-shadow:inset 0 -3px 0 var(--acc)}
.cal button i{position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#000}
.cal button:not(.none):not(.light):not(.drink) i{background:var(--acc)}
.cal button.out{visibility:hidden}
/* sport */
.phases{display:grid;gap:8px}
.ph{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;padding:12px;border-radius:16px;background:var(--card2)}
.ph i{border-radius:8px}
.ph.cur{outline:2px solid var(--acc)}
.ph b{font-family:"Barlow Condensed";font-size:20px;font-style:italic;text-transform:uppercase}
details.mini{background:none;margin:10px 0 0;border-top:1px solid var(--line);border-radius:0}details.mini summary{padding:12px 0;min-height:48px}
details{background:var(--card);border-radius:22px;margin:0 0 12px;overflow:hidden}
summary{list-style:none;padding:16px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:800 26px "Barlow Condensed";color:var(--acc)}
details[open] summary::after{content:"–"}
.det{padding:0 18px 18px}
.det ol,.det ul{padding-left:20px;margin:.4em 0}
.det li{margin:.2em 0}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--card2);border-radius:999px;padding:3px 9px;margin:2px 4px 2px 0;color:var(--mute)}
/* bilan */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px}
.stat .num{font-size:46px;font-style:italic}
.stat span{font-size:13px;color:var(--mute);font-weight:600}
.lvl{display:flex;align-items:center;gap:16px}
.diamond{width:58px;height:58px;flex:none;display:grid;place-items:center}
.diamond i{width:40px;height:40px;transform:rotate(45deg);border-radius:6px;border:2px solid rgba(255,255,255,.25)}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{background:var(--card2);border-radius:18px;padding:14px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--mute);opacity:.45}
.badge.got{opacity:1;color:var(--ink);background:linear-gradient(160deg,#2a1206,#1d1d21)}
.badge .num{font-size:30px;font-style:italic;color:var(--acc);display:block}
.fig{position:relative;height:200px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.set label{display:block;font-size:14px;color:var(--mute);font-weight:600;margin:12px 0 6px}
.set input[type=date],.set input[type=number]{background:var(--card2);border:0;border-radius:12px;padding:12px;color:var(--ink);font:600 16px Barlow;width:100%}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days7 button{min-height:44px;border-radius:12px;background:var(--card2);font-weight:700}
.days7 button.on{background:var(--acc);color:#000}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:54px;color:var(--mute);font-size:11px;font-weight:700}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--acc)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--acc);color:#000;font:800 20px "Barlow Condensed";font-style:italic;padding:10px 20px;border-radius:999px;transition:transform .35s;z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.view{animation:none}.bar i,.toast{transition:none}}
@media(max-width:380px){h1{font-size:34px}.seg button{font-size:14px}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<nav><div id="nav"></div></nav>
<script>
{
/* ============ DONNÉES ============ */
const K='pisteNoire.v1';
const DEF={days:{},settings:{start:'2026-11-23',challengeEnd:'2026-12-24',skiDec:'',skiFeb:'2027-02-08',sportDays:[1,3,5],alcTarget:5,water:2000,scrGoal:30}};
let S;try{S=JSON.parse(localStorage.getItem(K))||null}catch(e){S=null}
if(!S)S=JSON.parse(JSON.stringify(DEF));
S.settings=Object.assign({},DEF.settings,S.settings||{});S.days=S.days||{};
/* Sobre depuis le lundi 23 nov. inclus : saisie unique */
if(!S.seed1){if(S.settings.start==='2026-11-25')S.settings.start='2026-11-23';['2026-11-23','2026-11-24'].forEach(k=>{const x=S.days[k]||(S.days[k]={});if(!x.alc)x.alc='none'});S.seed1=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const TODAY=iso(new Date());
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmt=s=>{const d=P(s);return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`};

/* Synchro Apple Santé via Raccourci iOS : ?d=AAAA-MM-JJ&pas=..&kcal=..&fc=..&vo2=..&min=..&poids=.. */
let HSYNC=false,INTR=null,WORK=false;
const RS={ig:'Instagram',fb:'Facebook',yt:'YouTube'};
const ALT=[['podcast','Podcast'],['musique','Musique'],['livre','Livre'],['film','Film choisi']];
try{const q=new URLSearchParams(location.search),o=q.get('open');if(o&&RS[o]){const k=iso(new Date()),x=S.days[k]||(S.days[k]={});x.op=x.op||{};x.op[o]=(x.op[o]||0)+1;save();INTR=o;history.replaceState(null,'',location.pathname+'#today')}}catch(e){}
try{const q=new URLSearchParams(location.search);if(q.has('pas')||q.has('fc')||q.has('kcal')||q.has('poids')){
 const num=k=>{const v=parseFloat(String(q.get(k)||'').replace(',','.'));return isFinite(v)&&v>0?v:null};
 let d=q.get('d')||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=iso(new Date());
 const x=S.days[d]||(S.days[d]={});const h={pas:num('pas'),kcal:num('kcal'),fc:num('fc'),vo2:num('vo2'),min:num('min')};
 Object.keys(h).forEach(k=>{if(h[k]==null)delete h[k];else h[k]=Math.round(h[k]*10)/10});x.h=Object.assign(x.h||{},h);
 const w=num('poids');if(w&&w>30&&w<250)x.w=Math.round(w*10)/10;
 save();HSYNC=true;history.replaceState(null,'',location.pathname+'#today')}}catch(e){}

/* Phases : du 25 nov. au ski de février, puis entretien */
const PH=[
 {n:'Reprise',c:'var(--g)',from:'2026-11-25',to:'2026-12-14',txt:'Charges légères (tu dois pouvoir faire 3 répétitions de plus), technique propre, on réveille les tendons. Les courbatures sont normales, la douleur articulaire non.'},
 {n:'Base de force',c:'var(--b)',from:'2026-12-15',to:'2027-01-11',txt:'On charge progressivement : +2,5 à 5 kg quand toutes les séries passent. Fêtes : 2 séances minimum par semaine, pas de culpabilité, on ne lâche juste pas.'},
 {n:'Force & explosivité ski',c:'var(--r)',from:'2027-01-12',to:'2027-02-01',txt:'Séries lourdes + sauts. Qualité avant quantité : chaque saut est rapide et réceptionné en silence, genoux dans l\'axe.'},
 {n:'Affûtage',c:'#f5f5f5',from:'2027-02-02',to:'2027-02-07',txt:'Volume réduit de 40 %, on garde l\'intensité. Tu arrives frais pour la compétition. Dernière séance 48 h avant le départ.'},
 {n:'Entretien',c:'var(--acc)',from:'2027-02-08',to:'2099-12-31',txt:'Après le ski : 2 à 3 séances par semaine pour garder la forme toute l\'année. On repartira sur un nouveau cycle.'}
];
const phaseOf=s=>{const i=PH.findIndex(p=>s>=p.from&&s<=p.to);return i<0?0:i};

/* Séances : rx = [reprise, base, force, affûtage, entretien] */
const SES={
 A:{n:'Jambes force',why:'Les cuisses qui tiennent toute la descente.',plan:'≈ 60 min · échauffement 10 min · squat et soulevé avec repos complets, puis 2 duos',bonus:'15 min de vélo facile + 5 min d\'étirements des hanches et des cuisses',ex:[
  ['Squat barre',['3×10 léger','4×8','5×5 lourd','3×5','3×8'],'Cuisses parallèles, dos gainé. Repos 2 min : c\'est le temps qu\'il faut pour soulever lourd.'],
  ['Soulevé de terre roumain',['3×10','4×8','4×6','2×6','3×8'],'Hanches vers l\'arrière, barre collée aux jambes. Repos 2 min.'],
  ['Fentes bulgares haltères',['3×8 /jambe','3×10 /jambe','4×8 /jambe','2×8 /jambe','3×10 /jambe'],'Duo 1 avec la chaise : fentes, puis chaise, puis 1 min de repos.'],
  ['Chaise contre le mur',['3×30 s','3×45 s','3×60 s','2×45 s','3×45 s'],'Duo 1 · cuisses à 90°, ta position de ski.'],
  ['Presse ou leg extension',['3×12','3×12','3×10','2×10','3×12'],'Duo 2 avec le leg curl, 1 min de repos après les deux.'],
  ['Leg curl machine',['3×12','3×12','3×10','2×10','3×12'],'Duo 2 · protège les genoux.']]},
 B:{n:'Haut du corps + gainage',why:'Gainage = stabilité sur les skis et dos protégé.',plan:'≈ 50 min · échauffement 8 min · 2 duos puis un circuit de gainage',bonus:'20 min de rameur ou vélo : 10 × (1 min fort / 1 min facile). Le cardio que la séance B n\'a pas.',ex:[
  ['Développé couché haltères',['3×10','4×8','4×6','3×6','3×8'],'Duo 1 avec le rowing : pas de repos entre les deux, 1 min 30 après.'],
  ['Rowing haltère un bras',['3×10 /bras','4×8 /bras','4×8 /bras','2×8 /bras','3×10 /bras'],'Duo 1 · tire le coude vers la hanche.'],
  ['Développé épaules haltères',['3×10','3×10','4×8','2×8','3×10'],'Duo 2 avec le curl, 1 min de repos après.'],
  ['Curl biceps',['3×12','3×10','3×10','2×10','3×12'],'Duo 2 · sans balancer le buste.'],
  ['Planche',['3×30 s','3×45 s','3×60 s','2×45 s','3×45 s'],'Circuit gainage : planche, latérale, dead bug, 45 s de repos, recommence.'],
  ['Planche latérale',['2×20 s /côté','3×30 s /côté','3×40 s /côté','2×30 s /côté','3×30 s /côté'],'Circuit gainage · les obliques encaissent les virages.'],
  ['Dead bug',['3×8 /côté','3×10 /côté','3×12 /côté','2×10 /côté','3×10 /côté'],'Circuit gainage · bas du dos collé au sol.']]},
 C:{n:'Ski athlétique + cardio',why:'Explosivité, équilibre et souffle pour enchaîner les runs.',plan:'≈ 60 min · échauffement 8 min · circuit de 6 exos (nombre de tours = 1er chiffre) · cardio pour finir',bonus:'10 min de mobilité chevilles-hanches + 10 min de cardio facile pour récupérer',ex:[

  <li>Recommence pour Facebook (<code>?open=fb</code>) et YouTube (<code>?open=yt</code>).</li></ol>
  <p>En plus, pour le temps : <b>Réglages → Temps d'écran → Limites d'app</b>, une limite de ${S.settings.scrGoal} min par jour sur les réseaux sociaux. Demande à ta femme de choisir le code : c'est ce qui la rend vraiment efficace.</p></div></details>
 </div>
 <div class="card"><h2>Badges</h2><div class="badges" style="margin-top:12px">${badges().map(b=>`<div class="badge ${b[0]?'got':''}"><span class="num">${b[1]}</span>${b[2]}</div>`).join('')}</div></div>
 <div class="card set"><h2>Réglages</h2>
  <label>Jours de séance (A, B, C dans l'ordre)</label><div class="days7">${[1,2,3,4,5,6,0].map(i=>`<button class="${st.sportDays.includes(i)?'on':''}" data-sd="${i}">${['D','L','M','M','J','V','S'][i]}</button>`).join('')}</div>
  <label for="skiDec">Ski de décembre (date de départ)</label><input type="date" id="skiDec" value="${st.skiDec}">
  <label for="skiFeb">Ski de février (date de départ)</label><input type="date" id="skiFeb" value="${st.skiFeb}">
  <label for="wat">Objectif d'eau par jour (ml, +500 les jours de sport)</label><input type="number" id="wat" min="1000" max="4000" step="250" value="${st.water}">
  <label for="scrG">Objectif réseaux sociaux par jour (min)</label><input type="number" id="scrG" min="0" max="240" step="5" value="${st.scrGoal}">
  <label for="alcT">Objectif jours sans alcool par semaine (après Noël)</label><input type="number" id="alcT" min="0" max="7" value="${st.alcTarget}">
 </div>
 <div class="card"><h2>Sauvegarde</h2><p class="small mute">Tes données restent sur ce téléphone. Exporte de temps en temps pour ne rien perdre.</p>
  <div class="row" style="margin-top:10px"><button class="pill" id="exp">Exporter</button><button class="pill" id="cpy">Copier</button><label class="pill" style="display:inline-flex;align-items:center">Importer<input type="file" id="imp" accept="application/json" hidden></label></div></div>`}

function drawLine(id,key,unit,dec){const s=document.getElementById(id);if(!s)return;const W=s.clientWidth,H=s.clientHeight;
 const pts=Object.keys(S.days).filter(k=>key(S.days[k])!=null).sort().map(k=>[k,+key(S.days[k])]);
 if(pts.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#9a9aa3" text-anchor="middle" font-size="14" font-family="Barlow">Il faut 2 mesures pour voir la courbe</text>`;return}
 const ys=pts.map(p=>p[1]),pad=(Math.max(...ys)-Math.min(...ys))*.15||1,mn=Math.min(...ys)-pad,mx=Math.max(...ys)+pad,t0=P(pts[0][0]),t1=P(pts[pts.length-1][0]);
 const X=k=>16+(P(k)-t0)/((t1-t0)||1)*(W-64),Y=v=>12+(mx-v)/(mx-mn)*(H-36);
 const d=pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join('');
 s.innerHTML=`<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a1f" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient></defs>
 <path d="${d}L${X(pts[pts.length-1][0])} ${H-24}L${X(pts[0][0])} ${H-24}Z" fill="url(#g${id})"/><path d="${d}" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linejoin="round"/>
 ${pts.length<40?pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="#0a0a0b" stroke="#ff5a1f" stroke-width="2"/>`).join(''):''}
 <text x="${W-4}" y="${Y(pts[pts.length-1][1])+4}" fill="#f4f4f5" font-size="14" font-weight="700" text-anchor="end" font-family="Barlow">${pts[pts.length-1][1].toFixed(dec)}${unit}</text>
 <text x="16" y="${H-6}" fill="#9a9aa3" font-size="12" font-family="Barlow">${t0.getDate()} ${MOIS[t0.getMonth()].slice(0,4)}.</text><text x="${W-48}" y="${H-6}" fill="#9a9aa3" font-size="12" text-anchor="end" font-family="Barlow">${t1.getDate()} ${MOIS[t1.getMonth()].slice(0,4)}.</text>`}
function drawW(){drawLine('wsvg',x=>x.w||null,'',1);drawLine('fsvg',x=>x.h&&x.h.fc||null,'',0)}
const wro=new ResizeObserver(drawW);


function vWork(){const d=S.days[sel]||{},ph=phaseOf(sel),pl=planned(sel),ses=SES[openSes]?openSes:SES[d.sport]?d.sport:pl||'A';
 return `<div class="work"><div class="workIn"><div class="row between" style="margin-bottom:10px"><span class="small mute">${PH[ph].n} · ${sel===TODAY?'aujourd\'hui':fmt(sel)}</span><button class="pill" data-wclose="1">Fermer</button></div>
 <h1>Séance ${ses}</h1>
  ${ses&&SES[ses]?`<p class="small" style="margin-top:12px"><b>${SES[ses].n}</b> <span class="mute">${SES[ses].why}</span></p><div class="row between" style="background:var(--card2);border-radius:14px;padding:10px 12px;margin:10px 0 4px"><span class="small">${SES[ses].plan}</span><div class="row" style="gap:6px;flex:none"><button class="pill" data-rest="90" id="rest90" style="background:var(--acc);color:#000">1:30</button><button class="pill" data-rest="120" id="rest120" style="background:var(--acc);color:#000">2:00</button></div></div><p class="small" style="margin:6px 0 0"><b style="color:var(--acc)">Bonus si tu as 1 h 30 :</b> <span class="mute">${SES[ses].bonus}</span></p><div>${SES[ses].ex.map((e,i)=>{const on=d.ex&&d.ex[ses+i];return `<div class="ex"><button class="chk ${on?'on':''}" data-ex="${ses+i}" aria-label="Fait : ${e[0]}">${on?CHECK:''}</button><div><b>${e[0]}</b><div class="tip">${e[2]}</div></div><div class="rx">${e[1][ph]}</div></div>`}).join('')}</div>
  <button class="cta ${d.sport===ses?'done':''}" data-done="${ses}" style="width:100%;margin-top:12px">${d.sport===ses?'Séance validée ✓ · annuler':'Valider la séance'}</button>`:''}
 </div></div>`}
function vIntr(){const d=S.days[TODAY]||{},n=(d.op&&d.op[INTR])||1,tot=Object.values(d.op||{}).reduce((a,b)=>a+b,0);
 return `<div class="intr"><div class="intrIn"><span class="lab" style="color:var(--acc2);font-weight:700;text-transform:uppercase;font-size:13px">${n}e ouverture aujourd'hui · ${tot} en tout</span>
 <h1 style="font-size:clamp(44px,13vw,64px);margin:8px 0 6px">${RS[INTR]},<br>vraiment ?</h1>
 <p class="mute">${streak()} jours sans alcool d'affilée. Ne remplace pas une habitude par une autre.</p>
 <p style="margin:18px 0 8px;font-weight:700">Plutôt :</p>
 <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">${ALT.map(a=>`<button data-ialt="${a[0]}">${a[1]}</button>`).join('')}</div>
 <button class="cta ghost" data-ipro="1" style="width:100%;margin-top:14px">Usage pro (boutique), 5 min</button>
 <button class="pill" data-iclose="1" style="width:100%;margin-top:8px;background:none;color:var(--mute)">J'y vais quand même</button></div></div>`}
function render(){
 app.innerHTML=`<div class="view">${({today:vToday,cal:vCal,sport:vSport,food:vFood,me:vMe})[view]()}</div>${WORK?vWork():''}${INTR?vIntr():''}`;
 document.getElementById('nav').innerHTML=Object.keys(NAVL).map(k=>`<button class="${view===k?'on':''}" data-go="${k}">${ICO[k]}${NAVL[k]}</button>`).join('');
 wro.disconnect();document.querySelectorAll('.fig').forEach(f=>wro.observe(f))
}
let tt;const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)};
const go=v=>{view=v;history.replaceState(null,'','#'+v);render();scrollTo(0,0)};

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const ds=b.dataset,d=()=>day(sel);
 if(ds.go){go(ds.go);return}
 if(ds.nav){const n=add(sel,+ds.nav);if(n<=TODAY){sel=n;openSes=null;render()}return}
 if(ds.alc){const x=d();x.alc=x.alc===ds.alc?undefined:ds.alc;save();render();if(x.alc==='none')toast(`+10 XP · série ${streak()}`);return}
 if(ds.ses){openSes=ds.ses;render();return}
 if(ds.work){const dd=S.days[sel]||{},p=planned(sel);if(!SES[openSes])openSes=SES[dd.sport]?dd.sport:(p||'A');WORK=true;render();scrollTo(0,0);return}
 if(ds.wclose){WORK=false;render();return}
 if(ds.ex){const x=d();x.ex=x.ex||{};x.ex[ds.ex]=!x.ex[ds.ex];const s=ds.ex[0];const all=SES[s].ex.every((_,i)=>x.ex[s+i]);if(all&&x.sport!==s){x.sport=s;toast('Séance bouclée · +20 XP')}save();render();return}
 if(ds.done){const x=d();if(x.sport===ds.done){x.sport=undefined}else{x.sport=ds.done;toast('+20 XP · bien joué')}save();render();return}
 if(ds.rest){clearInterval(window._rt);const id=b.id,lab=b.textContent;let t=+ds.rest;const tick=()=>{const el=document.getElementById(id);if(!el){clearInterval(window._rt);return}if(t<=0){el.textContent=lab;clearInterval(window._rt);toast('Repos terminé, série suivante');return}el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;t--};tick();window._rt=setInterval(tick,1000);return}
 if(ds.meal){const[f,p]=ds.meal.split(':'),x=d();x[f]=x[f]===p?undefined:p;save();render();if(x[f]&&OKP.includes(p))toast('+5 XP');return}
 if(ds.de){const x=d();x.de=x.de===ds.de?undefined:ds.de;save();render();return}
 if(ds.gr){const x=d();if(ds.gr==='0'){x.gr=x.gr===0?undefined:0;if(x.gr===0)toast('Zéro grignotage · +5 XP')}else{x.gr=(x.gr||0)+1}save();render();return}
 if(ds.ish){S.ish=(S.ish||0)+3;save();render();return}
 if(ds.alt){const x=d();x.alt=x.alt||[];const had=x.alt.length;x.alt=x.alt.includes(ds.alt)?x.alt.filter(z=>z!==ds.alt):[...x.alt,ds.alt];save();render();if(!had&&x.alt.length)toast('+3 XP · bon choix');return}
 if(ds.ialt){const x=day(TODAY);x.alt=x.alt||[];if(!x.alt.includes(ds.ialt))x.alt.push(ds.ialt);INTR=null;save();sel=TODAY;render();toast('Bon choix · +3 XP');return}
 if(ds.ipro){const x=day(TODAY);x.pro=(x.pro||0)+1;INTR=null;save();render();toast('Ok, 5 min chrono');return}
 if(ds.iclose){INTR=null;render();return}
 if(ds.wa){const x=d(),was=(x.wa||0)>=wGoal(x);x.wa=Math.max(0,(x.wa||0)+(+ds.wa));save();render();if(!was&&x.wa>=wGoal(x))toast('Objectif eau atteint · +5 XP');return}
 if(ds.t){const x=d();x[ds.t]=!x[ds.t];save();render();if(x[ds.t])toast('+5 XP');return}
 if(ds.day){sel=ds.day;openSes=null;go('today');return}
 if(ds.m){const[y,m]=calM.split('-').map(Number);const n=new Date(y,m-1+(+ds.m),1);calM=iso(n).slice(0,7);render();return}
 if(ds.sd){const i=+ds.sd,a=S.settings.sportDays;S.settings.sportDays=a.includes(i)?a.filter(z=>z!==i):[...a,i];save();render();return}
 if(b.id==='exp'){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`piste-noire-${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();return}
 if(b.id==='cpy'){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Copié'),()=>toast('Copie impossible'));return}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='w'){const v=parseFloat(String(t.value).replace(',','.'));const x=day(sel);if(v>30&&v<250)x.w=Math.round(v*10)/10;else delete x.w;save();toast(x.w?'Pesée enregistrée':'Pesée effacée');return}
 if(t.id==='skiDec'||t.id==='skiFeb'){S.settings[t.id]=t.value;save();return}
 if(t.id==='wat'){S.settings.water=Math.max(1000,Math.min(4000,parseInt(t.value)||2000));save();return}
 if(t.id==='scr'){const v=parseInt(t.value);const x=day(sel);if(v>=0&&v<=900)x.scr=v;else delete x.scr;save();render();if(x.scr!=null)toast(x.scr<=S.settings.scrGoal?'Sous l\'objectif · +5 XP':'Au-dessus de l\'objectif, demain on fait mieux');return}
 if(t.id==='scrG'){S.settings.scrGoal=Math.max(0,Math.min(240,parseInt(t.value)||30));save();return}
 if(t.id==='alcT'){S.settings.alcTarget=Math.max(0,Math.min(7,parseInt(t.value)||5));save();return}
 if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.days&&typeof o.days==='object'){S.days=o.days;S.settings=Object.assign({},DEF.settings,o.settings||{});save();render();toast('Données importées')}else toast('Fichier invalide')}catch(err){toast('Fichier invalide')}};r.readAsText(t.files[0])}
});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAVL[h]&&h!==view){view=h;render()}});
render();if(HSYNC)setTimeout(()=>toast('Données Santé synchronisées'),300);
if('serviceWorker'in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
